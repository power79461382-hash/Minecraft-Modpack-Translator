name: Translator tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check syntax
        run: python -m compileall -q MinecraftTranslatorGUI.py gui core translate_cli.py translator_providers.py translation_cache.py translation_packager.py repair_advancements.py
      - name: Run regression tests
        run: python -m pytest tests/ -q
      - name: Validate Windows packaging
        if: runner.os == 'Windows'
        run: python -m PyInstaller --clean --noconfirm MinecraftTranslatorGUI.spec
