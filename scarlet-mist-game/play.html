<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#120008"><title>紅霧異變・手機彈幕</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080106;color:#fff;font-family:monospace;touch-action:none}body{display:grid;place-items:center}#wrap{position:relative;width:min(100vw,100vh*1.333);aspect-ratio:4/3;background:#120008;border:2px solid #8b1631;box-shadow:0 0 30px #000}canvas{width:100%;height:100%;display:block;background:#050005}.top{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:center;gap:8px;pointer-events:none}.top button{pointer-events:auto;border:1px solid #a93350;background:#220711;color:#ffd8e0;border-radius:6px;padding:8px 12px;font-weight:700}.joy{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:130px;height:130px;border:2px solid #ff6785;border-radius:50%;background:radial-gradient(circle,#430b1b88,#12040bdd);touch-action:none}.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#a61d43;border:2px solid #ff9caf;box-shadow:0 4px 14px #000}.pad{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:165px;height:145px}.b{position:absolute;border:2px solid #ff7891;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d23259,#510b22);color:#fff;font-weight:900;box-shadow:0 5px 15px #000;touch-action:none}.shot{width:76px;height:76px;right:0;bottom:0}.bomb{width:62px;height:62px;right:75px;bottom:72px}.slow{width:58px;height:58px;right:98px;bottom:2px;font-size:11px}.b.on{transform:scale(.91);filter:brightness(1.4)}@media(hover:hover) and (pointer:fine){.joy,.pad{opacity:.28}}</style></head><body><div id="wrap"><canvas id="c" width="960" height="720"></canvas><div class="top"><button id="pause">暫停</button><button id="fs">全螢幕</button><button id="mute">靜音</button></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="pad"><button class="b bomb" data-k="bomb">BOMB</button><button class="b slow" data-k="slow">低速</button><button class="b shot" data-k="shot">射擊</button></div></div><script>(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height,F={x:52,y:28,w:590,h:664},P={x:347,y:630,r:4,lives:3,bombs:3,power:1,inv:0,shot:0},K={l:0,r:0,u:0,d:0,shot:0,bomb:0,slow:0},bul=[],eb=[],foe=[],stars=[],items=[];let score=0,graze=0,stage=1,boss=null,t=0,paused=false,muted=false,over=false,bombCd=0,spawn=0;for(let i=0;i<120;i++)stars.push({x:Math.random()*F.w+F.x,y:Math.random()*F.h+F.y,s:.5+Math.random()*2});function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function hit(a,b,r){let dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<r*r}function shoot(){if(P.shot-->0)return;P.shot=K.slow?4:7;let n=P.power>=3?3:2;for(let i=0;i<n;i++){let o=(i-(n-1)/2)*13;bul.push({x:P.x+o,y:P.y-16,vx:o*.03,vy:-11,d:K.slow?4:3})}}function addEnemy(){let xx=F.x+35+Math.random()*(F.w-70);foe.push({x:xx,y:F.y-20,hp:18+stage*5,v:1+Math.random()*1.2,cd:40+Math.random()*45})}function fire(e,kind=0){let a=Math.atan2(P.y-e.y,P.x-e.x),n=kind?16:5;for(let i=0;i<n;i++){let q=kind?i*Math.PI*2/n:a+(i-(n-1)/2)*.15,s=2.1+stage*.12;eb.push({x:e.x,y:e.y,vx:Math.cos(q)*s,vy:Math.sin(q)*s,r:5,h:0})}}function makeBoss(){boss={x:F.x+F.w/2,y:F.y+95,hp:1000+stage*380,max:1000+stage*380,cd:25,spin:0,name:['露米婭','琪露諾','紅美鈴','帕秋莉','十六夜咲夜','蕾米莉亞'][stage-1]};eb.length=0}function useBomb(){if(P.bombs<1||bombCd>0||over)return;P.bombs--;bombCd=180;eb.length=0;for(const e of foe)e.hp-=30;if(boss)boss.hp-=120}function die(){if(P.inv>0)return;P.lives--;P.bombs=3;P.inv=150;eb.length=0;P.x=F.x+F.w/2;P.y=F.y+F.h-58;if(P.lives<0)over=true}function reset(){score=0;graze=0;stage=1;P.lives=3;P.bombs=3;P.power=1;P.x=F.x+F.w/2;P.y=F.y+F.h-58;bul.length=eb.length=foe.length=items.length=0;boss=null;over=false;t=0}function update(){if(paused||over)return;t++;if(P.inv>0)P.inv--;if(bombCd>0)bombCd--;let sp=K.slow?2.3:4.8,dx=K.r-K.l,dy=K.d-K.u;if(dx&&dy){dx*=.707;dy*=.707}P.x=clamp(P.x+dx*sp,F.x+10,F.x+F.w-10);P.y=clamp(P.y+dy*sp,F.y+10,F.y+F.h-10);if(K.shot)shoot();if(K.bomb){K.bomb=0;useBomb()}for(const s of stars){s.y+=s.s;if(s.y>F.y+F.h){s.y=F.y;s.x=F.x+Math.random()*F.w}}for(const b of bul){b.x+=b.vx;b.y+=b.vy}for(let i=bul.length-1;i>=0;i--)if(bul[i].y<F.y-30)bul.splice(i,1);if(!boss){if(++spawn>45){spawn=0;addEnemy()}if(t>1500)makeBoss()}for(let i=foe.length-1;i>=0;i--){let e=foe[i];e.y+=e.v;if(--e.cd<0){e.cd=70-stage*4;fire(e)}for(let j=bul.length-1;j>=0;j--)if(hit(e,bul[j],13)){e.hp-=bul[j].d;bul.splice(j,1)}if(e.hp<=0){score+=500;items.push({x:e.x,y:e.y,v:1.5});foe.splice(i,1)}else if(e.y>F.y+F.h+25)foe.splice(i,1)}if(boss){boss.x=F.x+F.w/2+Math.sin(t*.013)*170;boss.spin+=.025;if(--boss.cd<0){boss.cd=Math.max(10,28-stage*2);fire(boss,Math.random()<.45?1:0)}for(let j=bul.length-1;j>=0;j--)if(hit(boss,bul[j],28)){boss.hp-=bul[j].d;bul.splice(j,1)}if(boss.hp<=0){score+=50000;stage++;boss=null;t=0;foe.length=eb.length=0;if(stage>6){over=true}}}for(let i=eb.length-1;i>=0;i--){let b=eb[i];b.x+=b.vx;b.y+=b.vy;if(b.x<F.x-30||b.x>F.x+F.w+30||b.y<F.y-30||b.y>F.y+F.h+30){eb.splice(i,1);continue}let d=Math.hypot(b.x-P.x,b.y-P.y);if(d<9){eb.splice(i,1);die()}else if(!b.h&&d<28){b.h=1;graze++;score+=10}}for(let i=items.length-1;i>=0;i--){let q=items[i];q.y+=q.v;if(P.y<F.y+160){let a=Math.atan2(P.y-q.y,P.x-q.x);q.x+=Math.cos(a)*5;q.y+=Math.sin(a)*5}if(hit(P,q,18)){P.power=Math.min(4,P.power+1);score+=1000;items.splice(i,1)}else if(q.y>F.y+F.h+20)items.splice(i,1)}}function draw(){x.fillStyle='#050005';x.fillRect(0,0,W,H);x.fillStyle='#15000b';x.fillRect(F.x,F.y,F.w,F.h);for(const s of stars){x.fillStyle='rgba(255,170,190,'+(.25+s.s/3)+')';x.fillRect(s.x,s.y,s.s,s.s*2)}x.strokeStyle='#7f1731';x.lineWidth=3;x.strokeRect(F.x,F.y,F.w,F.h);for(const b of bul){x.fillStyle='#fff7a0';x.fillRect(b.x-2,b.y-8,4,14)}for(const b of eb){x.beginPath();x.fillStyle=['#ff5071','#6ac7ff','#d98cff'][Math.floor((b.x+b.y)%3)];x.arc(b.x,b.y,b.r,0,7);x.fill()}for(const e of foe){x.fillStyle='#8c3258';x.beginPath();x.arc(e.x,e.y,13,0,7);x.fill();x.fillStyle='#ffd4df';x.fillRect(e.x-9,e.y-17,18,4)}for(const q of items){x.fillStyle='#ff4266';x.fillRect(q.x-7,q.y-7,14,14);x.fillStyle='#fff';x.font='bold 12px monospace';x.fillText('P',q.x-4,q.y+4)}if(boss){x.fillStyle='#b82954';x.beginPath();x.arc(boss.x,boss.y,27,0,7);x.fill();x.fillStyle='#fff';x.font='bold 18px monospace';x.fillText(boss.name,boss.x-35,boss.y-38);x.fillStyle='#300812';x.fillRect(F.x+30,F.y+18,F.w-60,10);x.fillStyle='#ff4266';x.fillRect(F.x+30,F.y+18,(F.w-60)*boss.hp/boss.max,10)}if(P.inv%8<4){x.save();x.translate(P.x,P.y);x.fillStyle='#fff';x.beginPath();x.moveTo(0,-14);x.lineTo(11,10);x.lineTo(0,6);x.lineTo(-11,10);x.fill();if(K.slow){x.strokeStyle='#ff6986';x.beginPath();x.arc(0,0,8,0,7);x.stroke()}x.restore()}x.fillStyle='#1b0710';x.fillRect(660,28,270,664);x.fillStyle='#ffd9e2';x.font='bold 20px monospace';x.fillText('紅霧異變',690,70);x.font='16px monospace';x.fillText('SCORE '+String(score).padStart(8,'0'),690,120);x.fillText('LIFE  '+Math.max(0,P.lives),690,160);x.fillText('BOMB  '+P.bombs,690,195);x.fillText('POWER '+P.power+'/4',690,230);x.fillText('GRAZE '+graze,690,265);x.fillText('STAGE '+Math.min(stage,6),690,300);x.fillStyle='#b77a8b';x.font='13px monospace';x.fillText('方向鍵 / 左搖桿 移動',690,580);x.fillText('Z / 射擊　X / BOMB',690,605);x.fillText('Shift / 低速',690,630);if(paused){x.fillStyle='#000b';x.fillRect(F.x,F.y,F.w,F.h);x.fillStyle='#fff';x.font='bold 42px monospace';x.fillText('PAUSE',F.x+210,F.y+330)}if(over){x.fillStyle='#000c';x.fillRect(F.x,F.y,F.w,F.h);x.fillStyle='#ff6b86';x.font='bold 38px monospace';x.fillText(stage>6?'ALL CLEAR':'GAME OVER',F.x+150,F.y+300);x.fillStyle='#fff';x.font='18px monospace';x.fillText('點射擊或按 Z 重新開始',F.x+155,F.y+350)}}function loop(){update();draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{let m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',KeyZ:'shot',KeyX:'bomb',ShiftLeft:'slow'}[e.code];if(m){K[m]=1;e.preventDefault()}if(e.code==='Escape')paused=!paused;if(over&&e.code==='KeyZ')reset()});addEventListener('keyup',e=>{let m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',KeyZ:'shot',ShiftLeft:'slow'}[e.code];if(m)K[m]=0});document.querySelectorAll('.b').forEach(b=>{let k=b.dataset.k;let on=e=>{e.preventDefault();b.classList.add('on');if(over&&k==='shot')reset();else K[k]=1},off=e=>{e.preventDefault();b.classList.remove('on');if(k!=='bomb')K[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off)});const joy=document.getElementById('joy'),kn=document.getElementById('knob');let jid=null;function jm(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),max=42;if(d>max){dx*=max/d;dy*=max/d}kn.style.transform=`translate(${dx}px,${dy}px)`;K.l=dx<-10;K.r=dx>10;K.u=dy<-10;K.d=dy>10}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===jid){jid=null;kn.style.transform='';K.l=K.r=K.u=K.d=0}};pause.onclick=()=>paused=!paused;fs.onclick=()=>document.documentElement.requestFullscreen?.();mute.onclick=()=>{muted=!muted;mute.textContent=muted?'音效關':'靜音'};loop()})();</script></body></html>
